name: Public spot multi-venue research scan
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: public-market-scan
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline regression suite
        run: python -m unittest discover -s tests -v
      - name: Collect observed public spot quotes
        run: python -m radar.scan --output out/latest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quote-research-${{ github.run_id }}
          path: out/
          retention-days: 30
          if-no-files-found: warn
