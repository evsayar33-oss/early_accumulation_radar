name: Public spot multi-venue research scan
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: public-market-scan
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Start bounded resource telemetry
        continue-on-error: true
        run: python3 scripts/resource_probe.py start
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline regression suite
        run: python -m unittest discover -s tests -v
      - name: Collect observed public spot quotes
        run: python -m radar.scan --output out/latest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quote-research-${{ github.run_id }}
          path: out/
          retention-days: 30
          if-no-files-found: warn
      - name: Report runner capacity
        if: always()
        continue-on-error: true
        run: |
          probe="$RUNNER_TEMP/repo-resource-$GITHUB_RUN_ID-$GITHUB_JOB/probe.py"
          if test -f "$probe"; then python3 "$probe" finish; else echo "::warning::Resource telemetry unavailable"; fi
