name: V8 all-symbol perpetual early-motion evidence (RESEARCH ONLY)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/perp_early_watch.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/perp_early_watch.yml'
      - 'research_v4/perp_watch.py'
      - 'research_v4/perp_anomaly.py'
      - 'research_v4/preimpulse_study.py'
  workflow_dispatch:
  schedule:
    - cron: '9,39 * * * *' # best effort, NOT realtime
permissions:
  contents: write
concurrency:
  group: early-radar-v8-perp-evidence
  cancel-in-progress: false
jobs:
  provider-smoke-pr-only:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Start bounded resource telemetry
        continue-on-error: true
        run: python3 scripts/resource_probe.py start
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe public perpetual coverage (read-only, never a signal)
        continue-on-error: true
        run: |
          python - <<'PY'
          from research_v4.perp_watch import scan
          r=scan()
          print('PROVIDERS',r['sources'])
          print('UNAVAILABLE',r['source_unavailable'])
          print('VALID_USDT_PERPS',len(r['assets']))
          print('PIPPIN_ACTIVE', 'PIPPINUSDT' in r['assets'])
          print('FRESH_OKX_OI_CONTRACTS',r['open_interest_instruments_with_fresh_oi'])
          print('PIPPIN_OKX_OI_CONTRACTS',r['assets'].get('PIPPINUSDT',{}).get('okx',{}).get('oi_contracts'))
          from research_v4.perp_watch import cross_venue
          print('PIPPIN_VENUES', sorted(r['assets'].get('PIPPINUSDT',{})))
          print('PIPPIN_CROSS_VENUE',cross_venue(r['assets'].get('PIPPINUSDT',{})))
          PY
      - name: Read-only V10/V9 smoke on existing SHA-verified real V8 observations
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin research/v8-perp-forward
          git show FETCH_HEAD:observations/perp/snapshots.jsonl > "$RUNNER_TEMP/v8-real-snapshots.jsonl"
          python -m research_v4.perp_anomaly \
            --ledger "$RUNNER_TEMP/v8-real-snapshots.jsonl" \
            --out "$RUNNER_TEMP/v10-smoke"
          python -m research_v4.preimpulse_study \
            --ledger "$RUNNER_TEMP/v8-real-snapshots.jsonl" \
            --out "$RUNNER_TEMP/v9-smoke"
          python - <<'PY'
          import json,os
          p=os.path.join(os.environ['RUNNER_TEMP'],'v10-smoke','report.json')
          d=json.load(open(p))
          print('REAL_V8_COHORT',d['coins_in_snapshot'])
          print('REAL_V8_BASELINE_STATES',d['baseline_states'])
          print('PIPPIN_MEASURED','PIPPINUSDT' in {x['symbol'] for x in d['full_cohort']})
          PY
      - name: Report runner capacity
        if: always()
        continue-on-error: true
        run: |
          probe="$RUNNER_TEMP/repo-resource-$GITHUB_RUN_ID-$GITHUB_JOB/probe.py"
          if test -f "$probe"; then python3 "$probe" finish; else echo "::warning::Resource telemetry unavailable"; fi
  observe-perpetuals:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Start bounded resource telemetry
        continue-on-error: true
        run: python3 scripts/resource_probe.py start
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline unit tests (NO order routing)
        run: python -m unittest discover -s tests -v
      - name: Load the isolated permanent research record
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="research/v8-perp-forward"
          ROOT="$RUNNER_TEMP/v8-perp-state"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git worktree add -b v8-perp-observation-local "$ROOT" FETCH_HEAD
            test -f "$ROOT/observations/perp/snapshots.jsonl" || {
              echo "::error::V8_EXISTING_BRANCH_LEDGER_MISSING"; exit 1;
            }
          else
            git worktree add -b v8-perp-observation-local "$ROOT" HEAD
          fi
          mkdir -p "$ROOT/observations/perp"
          echo "V8_PERP_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Observe ALL eligible USDT perpetuals and append SHA-linked evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m research_v4.perp_watch \
            --ledger "$V8_PERP_ROOT/observations/perp/snapshots.jsonl" \
            --out out/v8_perp
          cat out/v8_perp/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: V10 simultaneous per-coin robust anomaly baselines, FULL cohort (advisory only)
        continue-on-error: true # V8 immutable ledger persistence is independent.
        shell: bash
        run: |
          set -euo pipefail
          python -m research_v4.perp_anomaly \
            --ledger "$V8_PERP_ROOT/observations/perp/snapshots.jsonl" \
            --out out/v10_anomalies
          cat out/v10_anomalies/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: V9 exploratory pre-impulse case-control audit, future labels ONLY after observations
        continue-on-error: true # Never risk the V8 append-only registry to add advisory research.
        run: |
          python -m research_v4.preimpulse_study \
            --ledger "$V8_PERP_ROOT/observations/perp/snapshots.jsonl" \
            --out out/v9_preimpulse
          cat out/v9_preimpulse/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload independent provider/outcome diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v8-perp-${{ github.run_id }}
          path: |
            out/v8_perp/
            out/v9_preimpulse/
            out/v10_anomalies/
          retention-days: 30
          if-no-files-found: warn
      - name: Persist V8-only forward evidence on separate research branch
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$V8_PERP_ROOT"
          git -C "$ROOT" config user.name 'github-actions[bot]'
          git -C "$ROOT" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$ROOT" add observations/perp/snapshots.jsonl
          git -C "$ROOT" commit -m "research(v8): append real observed futures snapshot [skip ci]"
          git -C "$ROOT" push origin HEAD:refs/heads/research/v8-perp-forward
      - name: Optional capped Telegram movement observations, never orders
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m research_v4.perp_notify --report out/v8_perp/report.json
      - name: Report runner capacity
        if: always()
        continue-on-error: true
        run: |
          probe="$RUNNER_TEMP/repo-resource-$GITHUB_RUN_ID-$GITHUB_JOB/probe.py"
          if test -f "$probe"; then python3 "$probe" finish; else echo "::warning::Resource telemetry unavailable"; fi
