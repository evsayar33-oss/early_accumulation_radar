name: Live public source diagnostics (branch smoke)
on:
  push:
    branches:
      - feature/v2-flow-prospective-evidence
      - fix/v2-source-integrity-and-alert-audit
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Public HTTP diagnostics (research only)
        run: python -m radar.research --output out/research.json
      - name: Print source coverage, never print secrets
        run: |
          python - <<'PY'
          import json
          d=json.load(open('out/research.json',encoding='utf8'))
          print('good_quotes', [(r['asset'],r['venues'] if 'venues' in r else 0,r['status']) for r in d['quotes']['assets']])
          print('sampled_tape_feeds',[(r['asset'],r['venue'],r['status'],r.get('count')) for r in d['sampled_tape']])
          print('candle_feeds',[(r['asset'],r['status']) for r in d['candle_diagnostics']])
          print('quote_source_failures',len(d['quotes']['failed_sources']))
          print('flow_failures',len(d['errors']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-public-source-diagnostics-${{ github.run_id }}
          path: out/research.json
          retention-days: 14
          if-no-files-found: warn
