name: Historical strategy discovery (research only)
on:
  workflow_dispatch:
    inputs:
      csv_path:
        description: "Repository-relative historical OHLCV CSV (must already exist on main)"
        required: true
        default: "data/historical/prices.csv"
permissions:
  contents: read
jobs:
  historical-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate discovery contracts
        run: python -m unittest discover -s tests -v
      - name: Require real supplied historical data
        env:
          INPUT_CSV: ${{ inputs.csv_path }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$INPUT_CSV" == /* || "$INPUT_CSV" == *..* || ! -f "$INPUT_CSV" ]]; then
            echo "::error::Historical CSV missing or unsafe path: $INPUT_CSV. No synthetic history is generated."
            exit 1
          fi
          python -m research_v4.historical_discovery --csv "$INPUT_CSV" --out out/historical_discovery
          cat out/historical_discovery/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-discovery-${{ github.run_id }}
          path: out/historical_discovery/
          retention-days: 90
          if-no-files-found: warn
