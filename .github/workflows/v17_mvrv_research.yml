name: V17 Real MVRV research (NO TRADING)

on:
  pull_request:
    paths:
      - research_v4/onchain_mvrv.py
      - tests/test_v17_mvrv.py
      - .github/workflows/v17_mvrv_research.yml
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * 1'
  push:
    paths:
      - research_v4/onchain_mvrv.py
      - tests/test_v17_mvrv.py
      - .github/workflows/v17_mvrv_research.yml

permissions:
  contents: read

concurrency:
  group: ear-v17-real-mvrv-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest tests.test_v17_mvrv -v
      - name: Real MVRV research
        if: github.event_name != 'pull_request'
        run: |
          python -m research_v4.onchain_mvrv --out out/v17_mvrv
          cat out/v17_mvrv/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Validate digest-bound evidence with Quant Superlab contract
        if: github.event_name != 'pull_request'
        run: |
          git clone --depth 1 https://github.com/evsayar33-oss/quant_superlab.git "$RUNNER_TEMP/quant_superlab"
          PYTHONPATH="$RUNNER_TEMP/quant_superlab" python -m research.portfolio_qualification.ear_mvrv out/v17_mvrv/btc.json out/v17_mvrv/eth.json --out out/v17_mvrv/superlab_receipts.json
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: v17-real-mvrv-${{ github.run_id }}
          path: out/v17_mvrv/
          retention-days: 30
